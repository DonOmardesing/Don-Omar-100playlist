*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;text-align:center;overflow-x:hidden;font-family:Montserrat,sans-serif}
.hdr{width:100vw;height:70vw;margin:0 0 0 50%;transform:translateX(-50%);overflow:hidden;background:#000}
.hdr img{width:100%;height:100%;object-fit:cover;display:block}
.luxo{max-width:760px;margin:10px auto 6px;padding:0 18px;font-weight:600;font-size:13px;line-height:1.35;color:#e8e6e1}
.luxo .line2{display:block;color:#00c8ff;margin-top:3px}
.desliza{font-weight:900;font-size:20px;letter-spacing:.18em;text-transform:uppercase;margin:7px 0 8px;display:flex;align-items:center;justify-content:center;gap:18px}
.desliza span{color:#ffd24a;font-size:30px;text-shadow:0 0 7px #ffd24a}
.play-section{border-top:5px double #0a84ff;border-bottom:5px double #0a84ff;padding:12px 0 22px;background:#000}
.carousel-wrap{width:100%;max-width:620px;margin:0 auto;padding:0 8px}
.carousel-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 5px}
.carousel-arrow{width:58px;height:50px;border:1px solid #ffd24a;border-radius:15px;background:#03070b;color:#ffd24a;font-size:32px;cursor:pointer}
.carousel-count{font-family:"Bebas Neue",cursive;font-size:20px;letter-spacing:2px}
.carousel-viewport{overflow:hidden;border-radius:18px;touch-action:pan-y}
.carousel-track{display:flex;transition:transform .28s ease;will-change:transform}
.carousel-slide{min-width:100%;padding:2px}
.carousel-card{border:2px solid #0a84ff;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#08131e,#02070b);box-shadow:0 0 22px rgba(0,132,255,.20),0 10px 30px rgba(0,0,0,.55)}
.carousel-cover{position:relative;aspect-ratio:1/1;overflow:hidden;background:#02060b}
.carousel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.carousel-number{position:absolute;top:10px;left:10px;z-index:2;background:rgba(0,0,0,.82);border:1px solid #00a8ff;border-radius:8px;padding:5px 9px;color:#00c8ff;font-family:"Bebas Neue",cursive;font-size:20px}
.carousel-info{padding:8px 10px 10px;text-align:center;background:#05090d}
.carousel-name{font-family:"Bebas Neue",cursive;font-size:22px;letter-spacing:1px;line-height:1.05;color:#fff;min-height:38px;display:flex;align-items:center;justify-content:center}
.listen-main{display:inline-flex;align-items:center;justify-content:center;margin-top:7px;min-width:135px;padding:9px 18px;border:1px solid #00c8ff;border-radius:999px;background:#031a2b;color:#00c8ff;font-size:13px;font-weight:900;letter-spacing:1.5px;cursor:pointer}
.collection-label{color:#00c8ff;font-size:13px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;margin:18px 0 8px}
.ft{padding:22px 16px 32px;border-top:3px solid #0066cc;margin-top:16px;font-size:12px;color:#9fb0bf}
@media(max-width:480px){
.hdr{height:70vw}
.luxo{margin-top:7px;font-size:12px}
.desliza{font-size:19px;margin:5px 0 6px;gap:16px}
.desliza span{font-size:28px}
.carousel-arrow{width:52px;height:46px;font-size:29px}
}
</style>

function makeSlide(item){

}
